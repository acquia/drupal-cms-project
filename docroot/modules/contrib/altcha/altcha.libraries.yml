altcha:
  version: "1.0.7"
  header: true
  js:
    assets/vendor/altcha/altcha.min.js: { minified: true, attributes: { defer: true, type: module }}

altcha-i18n-all:
  version: "1.0.7"
  header: true
  js:
    assets/vendor/altcha/i18n/all.min.js: { weight: -2, minified: true, attributes: { defer: true, type: module }}
  dependencies:
    - altcha/altcha

altcha.fallback:
