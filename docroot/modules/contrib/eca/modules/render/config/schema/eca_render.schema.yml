        NotBlank: []
    argument:
      type: string
      label: 'argument'

eca.event.plugin.eca_render:local_tasks:
  type:  mapping
  label: 'Local Tasks'

eca_render.action_base:
  type: mapping
  label: 'Render action base config'
  mapping: {}

eca_render.render_element_action_base:
  type: eca_render.action_base
  label: 'Render element action base config'
  mapping:
    name:
      type: eca.token_replaced_machine_name
      label: 'Machine name'
    token_name:
      type: eca.token_reference
      label: 'Token name'
    weight:
      type: weight
      label: 'Weight'
    mode:
      type: string
      label: 'Mode'
      constraints:
        EcaChoice:
          choices:
            - 'set:clear'
            - 'set:clear:defined'
            - 'merge'
            - 'prepend'
            - 'append'
            - 'nothing'
        # The form element is required, so it never offers "undefined".
        # @see \Drupal\eca_render\Plugin\Action\RenderElementActionBase::buildConfigurationForm
        NotBlank: []

action.configuration.eca_get_active_theme:
  type: mapping
  label: 'Configuration for the "Get Active Theme" action'
  mapping:
    token_name:
      type: eca.token_reference
      label: 'Token name'
      constraints:
        NotBlank: []

action.configuration.eca_render_details:
  type: eca_render.render_element_action_base
  label: 'Configuration for the "Render Details" action'
  mapping:
    title:
      type: string
      label: 'Title'
      constraints:
        NotBlank: []
    open:
      type: boolean
      label: 'Open'
    introduction_text:
      type: text
      label: 'Introduction text'
    summary_value:
      type: text
      label: 'Summary value'

action.configuration.eca_render_twig:
  type: eca_render.render_element_action_base
  label: 'Configuration for the "Render Twig" action'
  mapping:
    template:
      type: text
      label: 'Template'
      constraints:
        NotBlank: []
    value:
      type: text
      label: 'Context values'
    use_yaml:
      type: boolean
      label: 'Interpret above value as YAML format'
    validate_yaml:
      type: boolean
      label: 'Validate YAML to prevent this from being executed when invalid'

action.configuration.eca_render_views:views:
  type: eca_render.render_element_action_base
  label: 'Configuration for the "Render Views" action'
  mapping:
    view_id:
      type: string
      label: 'View'
      constraints:
        EcaChoice:
          callback: '\Drupal\eca_render\Plugin\Action\Views::getAllValidViews'
        NotBlank: []
    display_id:
      type: string
      label: 'Display'
    arguments:
      type: text
      label: 'Arguments'

action.configuration.eca_render_add_class:
  type: mapping
  label: 'Configuration for the "Render Add Class" action'
  mapping:
    name:
      type: eca.token_replaced_machine_name
      label: 'Machine name'
      constraints:
        NotBlank: []
    class:
      type: string
      label: 'Class name'
      constraints:
        NotBlank: []

action.configuration.eca_render_add_attached_library:
  type: mapping
  label: 'Configuration for the "Render Add Attached Library" action'
  mapping:
    name:
      # Deliberately without "NotBlank": the form element is not required, and
      # leaving it blank is a documented way of targeting the parent element.
      # The schema used to demand a value the user interface never asked for,
      # which made hand-written configuration fail validation over something a
      # site builder is free to do through the user interface.
      # @see \Drupal\eca_render\Plugin\Action\AddAttachedBase::buildConfigurationForm
      type: eca.token_replaced_machine_name
      label: 'Machine name'
    value:
      type: string
      label: 'Library ID'
      constraints:
        NotBlank: []

action.configuration.eca_render_add_attached_setting:
  type: mapping
  label: 'Configuration for the "Render Add Attached Setting" action'
  mapping:
    name:
      # Deliberately without "NotBlank", for the same reason as on the "Render
      # Add Attached Library" action above: both inherit this optional element
      # from the very same base class.
      # @see \Drupal\eca_render\Plugin\Action\AddAttachedBase::buildConfigurationForm
      type: eca.token_replaced_machine_name
      label: 'Machine name'
    collection:
      type: string
      label: 'Collection name'
      constraints:
        NotBlank: []
    key:
      type: string
      label: 'Setting key'
      constraints:
        NotBlank: []
    value:
      type: string
      label: 'Setting value'
      constraints:
        NotBlank: []

action.configuration.eca_render_build:
  type: eca_render.render_element_action_base
  label: 'Configuration for the "Render Build" action'
  mapping:
    value:
      type: text
      label: 'Value'
    use_yaml:
      type: boolean
      label: 'Interpret above value as YAML format'
    validate_yaml:
      type: boolean
      label: 'Validate YAML to prevent this from being executed when invalid'

action.configuration.eca_render_markup:
