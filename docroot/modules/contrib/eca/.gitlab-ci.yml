include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _AUTORUN_NEXT_MAJOR: 'push-and-schedule'
  _AUTORUN_NEXT_MINOR: 'push-and-schedule'
  _CSPELL_IGNORE_PATHS: '"**/eca.eca.*.yml"'
  _PHPUNIT_CONCURRENT: 1
  _PHPUNIT_EXTRA: '--suppress-deprecations'
  OPT_IN_TEST_PREVIOUS_MAJOR: 0
  OPT_IN_TEST_NEXT_MINOR: 1
  OPT_IN_TEST_NEXT_MAJOR: 1
  RUN_JOB_UPGRADE_STATUS: 0

cspell:
  allow_failure: false
phpcs:
  allow_failure: false
phpstan:
  allow_failure: false
phpstan (next minor):
  allow_failure: false
phpstan (next major):
  allow_failure: false
phpunit (previous major):
  allow_failure: false
phpunit (next minor):
  allow_failure: false
phpunit (next major):
  allow_failure: false
upgrade status:
  allow_failure: false
