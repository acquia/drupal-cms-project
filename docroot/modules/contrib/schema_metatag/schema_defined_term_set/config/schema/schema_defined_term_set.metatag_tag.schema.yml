# The 'type' should be "label" for short meta tags and "text" for ones which
# could get longer, especially ones which use a textarea field instead of a
# textfield.

metatag.metatag_tag.schema_defined_term_set_name:
  type: text
  label: 'name'
metatag.metatag_tag.schema_defined_term_set_type:
  type: string
  label: '@type'
metatag.metatag_tag.schema_defined_term_set_id:
  type: text
  label: '@id'
metatag.metatag_tag.schema_defined_term_set_description:
  type: text
  label: 'description'
metatag.metatag_tag.schema_defined_term_set_has_defined_term:
  type: text
  label: 'hasDefinedTerm'
