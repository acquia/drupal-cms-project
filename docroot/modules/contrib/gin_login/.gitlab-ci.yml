include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  # Coding standards errors should fail the pipeline.
  _PHPCS_ALLOW_FAILURE: '0'
  # Test on Drupal 10 to check support for Drupal 10.2+.
  OPT_IN_TEST_PREVIOUS_MAJOR: '1'
  # Test on Drupal 12 to check support for the next major version.
  OPT_IN_TEST_NEXT_MAJOR: '1'
  # Allow Gin and Gin Toolbar, which don't declare Drupal 12 support yet.
  _LENIENT_ALLOW_LIST: 'gin,gin_toolbar'
  # Keep stylelint off.
  SKIP_STYLELINT: '1'
  # .nvmrc and the frontend job's image use Node 16 to build dist/. The other
  # jobs use Node 24, because Drupal core's JavaScript tools need a more modern
  # Node version. Drupal 12 needs Node 24, and 10 and 11 work with it too.
  _NODE_VERSION: '24'

# Rebuild the CSS and JavaScript, and fail if the files in dist/ don't match
# what the build creates from src/.
frontend:
  stage: validate
  image: node:16.13-alpine
  needs: []
  script:
    - apk add bash git openssh
    - npm install
    - npm run build
    - 'git diff --exit-code src dist || (echo "Error: dist/ does not match the build of src/. Run npm run build and commit the result."; exit 1)'
