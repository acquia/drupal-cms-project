<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" font-family="Roboto, sans-serif">
  <defs>
    <style>
      .step { fill: #009688; rx: 8; }
      .step-text { fill: #fff; font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .sub { fill: #e0f2f1; stroke: #80cbc4; stroke-width: 1.5; rx: 6; }
      .sub-text { fill: #00695c; font-size: 12px; text-anchor: middle; dominant-baseline: central; }
      .arrow { fill: none; stroke: #78909c; stroke-width: 2; marker-end: url(#arrowhead); }
      .loop { fill: none; stroke: #b0bec5; stroke-width: 1.5; stroke-dasharray: 6,3; marker-end: url(#arrowhead-light); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#78909c"/>
    </marker>
    <marker id="arrowhead-light" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#b0bec5"/>
    </marker>
  </defs>
  <!-- Main flow: Create -> Edit -> Save -> Close -->
  <rect x="20" y="30" width="100" height="40" class="step"/>
  <text x="70" y="50" class="step-text">Create</text>
  <line x1="120" y1="50" x2="160" y2="50" class="arrow"/>
  <rect x="160" y="30" width="100" height="40" class="step"/>
  <text x="210" y="50" class="step-text">Edit</text>
  <line x1="260" y1="50" x2="300" y2="50" class="arrow"/>
  <rect x="300" y="30" width="100" height="40" class="step"/>
  <text x="350" y="50" class="step-text">Save</text>
  <line x1="400" y1="50" x2="440" y2="50" class="arrow"/>
  <rect x="440" y="30" width="100" height="40" class="step"/>
  <text x="490" y="50" class="step-text">Close</text>
  <!-- Sub-flow from Edit -->
  <line x1="210" y1="70" x2="210" y2="100" class="arrow"/>
  <rect x="140" y="100" width="140" height="36" class="sub"/>
  <text x="210" y="118" class="sub-text">Configure components</text>
  <line x1="210" y1="136" x2="210" y2="160" class="arrow"/>
  <rect x="150" y="160" width="120" height="36" class="sub"/>
  <text x="210" y="178" class="sub-text">Test / Replay</text>
  <!-- Loop arrow from Close back to Create -->
  <path d="M490,70 L490,205 L70,205 L70,70" class="loop"/>
</svg>
