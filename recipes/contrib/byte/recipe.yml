          - 'access content'
          - 'access contextual links'
          - 'access navigation'
          - 'bypass honeypot protection'
          - 'delete own files'
          - 'skip CAPTCHA'
          - 'use klaro'
          - 'use text format webform_default'
          - 'view media'
          - 'view own unpublished content'
          - 'view the administration theme'
